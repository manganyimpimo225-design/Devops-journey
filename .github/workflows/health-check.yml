name: Daily Health Check
on:
  schedule:
    - cron: '0 7 *' # Runs at 9am South Africa time
  workflow_dispatch: # Lets you run it manually

jobs:
  update-log:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This gives it permission to push
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Update health log
        run: |
          mkdir -p logs
          echo "$(date) - Automated health check - Site is UP" >> logs/health.log
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/health.log
          git commit -m "Auto health check - $(date)" || exit 0
          git push
