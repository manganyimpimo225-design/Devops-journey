      - name: Update health log
        run: |
          mkdir -p logs
          echo "$(date) - Automated health check - Site is UP" >> logs/health.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/health.log
          git commit -m "Auto health check - $(date)" || exit 0
      - name: Push changes
        uses: adrienbrunet/force-push-action@v1.0.0
        with:
          repository: ${{ github.repository }}
          branch: main
          token: ${{ secrets.GITHUB_TOKEN }}
          directory:.
